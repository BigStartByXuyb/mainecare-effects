name: Publish GitHub Packages

on:
  push:
    branches:
      - release-0.1.0-github-packages
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT" -path '*/bin/sdkmanager' -type f | sort | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Publish 0.1.0
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :motion:publishReleasePublicationToGitHubPackagesRepository \
            :glass:publishReleasePublicationToGitHubPackagesRepository \
            :deck:publishReleasePublicationToGitHubPackagesRepository \
            --no-daemon --console=plain

      - name: Verify remote artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          base="https://maven.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/mainecare-effects/com/mainecare/effects"
          for artifact in motion glass deck; do
            for file in \
              "${artifact}-0.1.0.pom" \
              "${artifact}-0.1.0.aar" \
              "${artifact}-0.1.0.module" \
              "${artifact}-0.1.0-sources.jar" \
              "${artifact}-0.1.0-license.txt" \
              "${artifact}-0.1.0-notice.txt" \
              "${artifact}-0.1.0-third-party-notices.md"; do
              url="${base}/${artifact}/0.1.0/${file}"
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" "${url}")
              echo "${artifact} ${file} ${code}"
              test "${code}" = "200"
            done
          done
